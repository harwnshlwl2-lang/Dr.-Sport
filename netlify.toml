[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/matches"
  to = "/.netlify/functions/matches"
  status = 200

[[redirects]]
  from = "/api/standings"
  to = "/.netlify/functions/standings"
  status = 200

[[redirects]]
  from = "/api/scorers"
  to = "/.netlify/functions/scorers"
  status = 200
