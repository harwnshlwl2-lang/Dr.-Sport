<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>سرمد سبورت</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--s1:#0c110f;--s2:#141b18;--line:#1f2a25;--tx:#eef5f1;--mu:#8a9a92;--g1:#06f26a;--g2:#17dcd0;--grad:linear-gradient(135deg,var(--g1),var(--g2));--live:#ff4d4d;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
h1,h2,.lg{font-family:Lalezar,"IBM Plex Sans Arabic",sans-serif;font-weight:400}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header img{width:34px;height:34px}
header h1{font-size:1.45rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
.soc{display:flex;gap:6px}.soc a{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;color:var(--g2)}
.soc svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:760px;margin:0 auto;padding:0 14px}
#ml{column-width:400px;column-gap:32px}.lb{break-inside:avoid;margin-bottom:6px}
@media(min-width:720px){main{max-width:980px;padding:0 24px}header{padding-inline:max(24px,calc(50vw - 490px))}.row{padding:15px 8px}
nav.bt{inset:auto auto 14px 50%;transform:translateX(-50%);width:440px;border:1px solid var(--line);border-radius:20px;padding:6px 10px}}
@media(min-width:1100px){main{max-width:1200px}header{padding-inline:max(24px,calc(50vw - 600px))}.t{font-size:1rem}}
.hero{position:relative;margin:14px 0;min-height:clamp(210px,36vw,440px);border-radius:18px;background:#0c110f center/cover;display:flex;align-items:flex-end;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.1) 70%)}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:var(--grad);box-shadow:0 0 26px 6px rgba(6,242,106,.55)}
.hin{position:relative;padding:18px;width:100%;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.hin h2{font-size:1.7rem;flex-basis:100%}
#cd{font-weight:600;font-variant-numeric:tabular-nums;color:var(--g1)}
.play{background:var(--grad);color:#00170a;font-weight:600;padding:9px 22px;border-radius:30px}
.sub,.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.sub a,.chips a{white-space:nowrap;padding:7px 16px;border-radius:30px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-size:.9rem}
.sub a.on,.chips a.on{background:var(--grad);color:#00170a;border-color:transparent;font-weight:600}
.lgh{display:flex;align-items:center;gap:8px;margin:20px 0 4px;color:var(--g2);font-family:Lalezar;font-size:1.15rem}
.row{display:grid;grid-template-columns:1fr 78px 1fr;align-items:center;gap:6px;padding:13px 4px;border-bottom:1px solid var(--line)}
.t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;min-width:0}
.t.a{flex-direction:row-reverse;text-align:left}
.t img,.ph{width:28px;height:28px;flex:none;object-fit:contain}
.ph{display:grid;place-items:center;border-radius:50%;background:var(--s2);color:var(--g2);font-size:.55rem;font-style:normal}
.mid{text-align:center;font-variant-numeric:tabular-nums}.mid b{display:block;font-size:1.05rem}
.mid small{color:var(--mu);font-size:.7rem}.mid small.lv{color:var(--live);font-weight:600}
.row em{grid-column:1/-1;font-size:.65rem;color:var(--mu);direction:ltr;text-align:left}
.msg{padding:40px 0;text-align:center;color:var(--mu)}.err{color:var(--live)}
.pl{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;background:#000;display:block;margin-top:14px}
.pw{position:relative;max-width:980px;margin:14px auto 0;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.pw .pl,.pw video{position:absolute;inset:0;width:100%;height:100%;margin:0;border-radius:0;background:#000}
.wm{position:absolute;top:10px;inset-inline-start:10px;z-index:3;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:20px;background:rgba(0,0,0,.55);pointer-events:none;font-family:Lalezar;font-size:.95rem}.wm img{width:22px;height:22px}
.pad{position:absolute;inset:auto 0 48px;z-index:4;display:flex;justify-content:center}.pad iframe{border:0;max-width:100%;height:60px;background:transparent}
.pad button{position:absolute;top:-12px;inset-inline-end:8px;width:24px;height:24px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:1rem;line-height:1}
.pe{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:20px;background:rgba(0,0,0,.88);color:var(--mu)}.pe[hidden]{display:none}
.sorry{margin:10px 0;padding:11px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-size:.88rem}
.mh{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);font-size:.88rem}
.tg a{background:var(--grad);color:#00170a;font-weight:600;padding:6px 14px;border-radius:20px;white-space:nowrap}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:.88rem;font-variant-numeric:tabular-nums}
th{color:var(--mu);font-weight:400;font-size:.72rem;padding:8px 4px}td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:center}
td.n{text-align:right}td.n div{display:flex;align-items:center;gap:8px}td b{color:var(--g1)}
.ad{width:100%;border:0;min-height:60px;margin:14px 0}
nav.bt{position:fixed;inset:auto 0 0;z-index:30;display:flex;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgba(0,0,0,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.bt a{flex:1;text-align:center;padding:10px;border-radius:14px;color:var(--mu);font-weight:600}
nav.bt a.on{color:var(--g1);background:var(--s1)}
nav.bt a.on::before{content:"";display:block;height:3px;width:28px;margin:0 auto 6px;border-radius:3px;background:var(--grad);box-shadow:0 0 12px var(--g1)}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <h1 id="sn"></h1>
  <div class="soc" id="soc"></div>
</header>
<main id="app"></main>
<nav class="bt"><a id="n1" href="#/">الرئيسية</a><a id="n2" href="#/live">البث المباشر</a></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script src="config.js"></script>
<script>
const C=CONFIG,$=s=>document.querySelector(s),app=$('#app'),admin=/admin=1/.test(location.search);
const LG={PL:'الدوري الإنجليزي',PD:'الدوري الإسباني',SA:'الدوري الإيطالي',BL1:'الدوري الألماني',FL1:'الدوري الفرنسي',CL:'دوري أبطال أوروبا',ACL:'دوري أبطال آسيا'};
const TB=['PL','PD','SA','BL1','FL1','CL'];
const iso=d=>d.toLocaleDateString('sv'),nm=n=>(C.names&&C.names[n])||n,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=u=>new Date(u).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
const cache={};let date=iso(new Date()),lg='all',timer;

// الشريط العلوي
$('#sn').textContent=C.siteName;
const I={telegram:'<path d="M21 3 3 10.5l6 2 2 6 3-4 5 4z"/><path d="m9 12.5 9-6"/>',
 whatsapp:'<path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3z"/><path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 .7c-.8-.4-1.6-1.2-2-2l.7-1-1-2z"/>',
 instagram:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6"/>',
 facebook:'<path d="M14 8h2.5V4.5H14C11.8 4.5 10.5 6 10.5 8v2H8v3.5h2.5V20H14v-6.5h2.5l.5-3.5h-3V8.5c0-.3.2-.5.5-.5z"/>'};
const links={telegram:C.social.telegram,whatsapp:'https://wa.me/'+C.whatsapp,instagram:C.social.instagram,facebook:C.social.facebook};
$('#soc').innerHTML=Object.keys(I).map(k=>`<a href="${esc(links[k])}" target="_blank" rel="noopener" aria-label="${k}"><svg viewBox="0 0 24 24">${I[k]}</svg></a>`).join('');

const ad=n=>C.ads&&C.ads[n]?`<iframe class="ad" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" srcdoc="${esc(C.ads[n])}"></iframe>`:'';
const crest=t=>t.c?`<img src="${esc(t.c)}" alt="" loading="lazy">`:`<i class="ph">${esc((t.t||t.n).slice(0,3))}</i>`;
const isLive=m=>m.status==='IN_PLAY'||m.status==='PAUSED';

let notes=[];const ld=u=>new Date(u).toLocaleDateString('sv');
async function load(d){
  const c=cache[d];if(c&&Date.now()-c.t<60000){notes=c.n;return c.m}
  const r=await fetch('/api/matches?date='+d),j=await r.json();
  if(!r.ok)throw new Error(j.error||r.status);
  const fx=t=>{const o=t.n;t.n=nm(o);if(!t.c&&C.crests&&C.crests[o])t.c=C.crests[o];return t};
  const m=j.matches.filter(x=>ld(x.utc)===d).map(x=>(fx(x.home),fx(x.away),x));
  notes=j.notes||[];cache[d]={m,t:Date.now(),n:notes};return m;
}
function row(m){
  const live=isLive(m),done=m.status==='FINISHED',sc=(live||done)&&m.hs!=null;
  const lab=live?(m.status==='PAUSED'?'استراحة':'مباشر'+(m.minute?' '+m.minute+"'":'')):done?'انتهت':m.status==='POSTPONED'?'مؤجلة':'';
  return `<a class="row" href="#/watch/${m.id}"><span class="t">${crest(m.home)}${esc(m.home.n)}</span><span class="mid"><b>${sc?m.hs+' - '+m.as:tm(m.utc)}</b><small class="${live?'lv':''}">${lab}</small></span><span class="t a">${crest(m.away)}${esc(m.away.n)}</span>${admin?`<em>${m.id}</em>`:''}</a>`;
}
function groups(ms){
  if(!ms.length)return '<p class="msg">لا توجد مباريات في هذا اليوم ضمن الدوريات المعتمدة.'+(admin&&notes.length?'<br><small class="err">'+notes.map(esc).join('<br>')+'</small>':'')+'</p>';
  const g={};ms.forEach(m=>(g[m.comp]=g[m.comp]||[]).push(m));
  return Object.keys(g).map((k,i)=>`<section class="lb"><div class="lgh">${LG[k]||k}</div>${g[k].map(row).join('')}${i===0?ad('middle'):''}</section>`).join('');
}
const subnav=on=>`<div class="sub"><a class="${on==='m'?'on':''}" href="#/">المباريات</a><a class="${on==='t'?'on':''}" href="#/table/PL">الترتيب</a><a class="${on==='s'?'on':''}" href="#/scorers/PL">الهدافون</a></div>`;
function hero(){
  const h=C.hero;if(!h.image)return '';
  return `<section class="hero" style="background-image:url('${encodeURI(h.image)}')"><div class="hin"><h2>${esc(h.title)}</h2><span id="cd" data-k="${esc(h.kickoff)}"></span>${h.matchId?`<a class="play" href="#/watch/${esc(h.matchId)}">▶ تشغيل</a>`:''}</div></section>`;
}
function tick(){
  const e=$('#cd');if(!e||!e.dataset.k)return;
  const s=Math.floor((new Date(e.dataset.k)-Date.now())/1000);
  if(isNaN(s))return;
  if(s<=0){e.textContent='بدأت المباراة';return}
  const p=n=>String(n).padStart(2,'0'),d=Math.floor(s/86400);
  e.textContent=(d?d+' يوم  ':'')+p(Math.floor(s%86400/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60);
}
const nav=k=>{$('#n1').className=k==='h'?'on':'';$('#n2').className=k==='l'?'on':''};

async function home(){
  nav('h');
  const chips=['all',...TB,'ACL'].map(k=>`<a class="${lg===k?'on':''}" data-lg="${k}">${k==='all'?'الكل':LG[k]}</a>`).join('');
  const days=[-1,0,1,2,3].map(o=>{const d=new Date();d.setDate(d.getDate()+o);const v=iso(d);
    return `<a class="${v===date?'on':''}" data-d="${v}">${['أمس','اليوم','غداً'][o+1]||d.toLocaleDateString('ar',{weekday:'long'})}</a>`}).join('');
  app.innerHTML=hero()+ad('top')+subnav('m')+`<div class="chips" id="dc">${days}</div><div class="chips" id="lc">${chips}</div><div id="ml"><p class="msg">جاري التحميل…</p></div>`;
  tick();
  $('#dc').onclick=e=>{if(e.target.dataset.d){date=e.target.dataset.d;home()}};
  $('#lc').onclick=e=>{if(e.target.dataset.lg){lg=e.target.dataset.lg;home()}};
  try{let ms=await load(date);if(lg!=='all')ms=ms.filter(m=>m.comp===lg);$('#ml').innerHTML=groups(ms)}
  catch(e){$('#ml').innerHTML=`<p class="msg err">تعذر جلب المباريات: ${esc(e.message)}</p>`}
}
async function live(){
  nav('l');app.innerHTML='<div class="lgh" style="margin-top:18px">البث المباشر</div><p class="msg">جاري التحميل…</p>';
  try{const ms=(await load(iso(new Date()))).filter(isLive);
    app.innerHTML='<div class="lgh" style="margin-top:18px">المباريات الجارية الآن</div>'+(ms.length?ms.map(row).join(''):'<p class="msg">لا توجد مباريات جارية الآن. تفقّد الرئيسية لمواعيد اليوم.</p>')}
  catch(e){app.innerHTML=`<p class="msg err">تعذر الجلب: ${esc(e.message)}</p>`}
}
function attach(raw){
  const v=$('#v');if(!v)return;const bad=()=>{const e=$('#pe');if(e)e.hidden=false};
  if(/^http:/i.test(raw)&&location.protocol==='https:')return bad();
  if(window.Hls&&Hls.isSupported()){const h=new Hls();h.loadSource(raw);h.attachMedia(v);h.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)bad()})}
  else if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=raw;else bad();
}
async function watch(id){
  nav('');app.innerHTML='<p class="msg">جاري التحميل…</p>';
  let m;try{m=(await load(date)).find(x=>x.id===id)||(await load(iso(new Date()))).find(x=>x.id===id)}catch(e){}
  const raw=C.streams[id]||(m&&C.compStreams&&C.compStreams[m.comp])||'',src=raw,isHls=/\.m3u8(\?|$)/i.test(raw);
  const url=src?(C.playerTemplate&&!isHls?C.playerTemplate.replace('{URL}',encodeURIComponent(src)):src):C.fallbackStream;
  const ifr=`<div class="pw">${isHls?'<video id="v" controls playsinline autoplay muted></video>':`<iframe class="pl" src="${esc(url)}" title="البث" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`}<div class="wm"><img src="logo.png" alt="">${esc(C.siteName)}</div>${C.ads&&C.ads.player?`<div class="pad"><iframe sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" srcdoc="${esc(C.ads.player)}"></iframe><button onclick="this.parentNode.remove()" aria-label="إغلاق">×</button></div>`:''}<div class="pe" id="pe" hidden>تعذر تشغيل البث. قد يكون الرابط منتهياً أو غير مسموح بتشغيله داخل المتصفح.</div></div>`;
  const sc=m&&m.hs!=null?`${m.hs} - ${m.as}`:m?tm(m.utc):'';
  app.innerHTML=`<p style="margin-top:12px"><a href="#/" style="color:var(--g2)">← رجوع</a></p>`+ifr
   +(src?'':'<p class="sorry">نعتذر، رابط البث لهذه المباراة غير متوفر حالياً. نعرض لك مؤقتاً تحليلات beIN SPORTS.</p>')
   +(m?`<div class="mh"><span class="t">${crest(m.home)}${esc(m.home.n)}</span><b class="lg" style="font-size:1.4rem">${sc}</b><span class="t a">${crest(m.away)}${esc(m.away.n)}</span></div>`:'')
   +`<div class="tg"><span>تابعنا على تيليجرام ليصلك كل جديد</span><a href="${esc(C.telegramChannel)}" target="_blank" rel="noopener">تابع</a></div>`+ad('watch');
  attach(raw);
}
async function table(c){
  nav('h');
  const chips=TB.map(k=>`<a class="${c===k?'on':''}" href="#/table/${k}">${LG[k]}</a>`).join('');
  app.innerHTML=subnav('t')+`<div class="chips">${chips}</div><p class="msg">جاري التحميل…</p>`;
  try{const r=await fetch('/api/standings?comp='+c),j=await r.json();if(!r.ok)throw new Error(j.error||r.status);
    const body=j.groups.map(g=>(g.name?`<div class="lgh">${esc(g.name)}</div>`:'')+`<table><tr><th>#</th><th style="text-align:right">الفريق</th><th>لعب</th><th>+/-</th><th>نقاط</th></tr>${g.rows.map(x=>`<tr><td>${x.p}</td><td class="n"><div>${crest({c:x.c,t:x.t,n:x.n})}${esc(nm(x.n))}</div></td><td>${x.pl}</td><td>${x.gd}</td><td><b>${x.pts}</b></td></tr>`).join('')}</table>`).join('');
    app.querySelector('.msg').outerHTML=body||'<p class="msg">لا يوجد ترتيب متاح لهذه البطولة.</p>'}
  catch(e){app.querySelector('.msg').outerHTML=`<p class="msg err">تعذر جلب الترتيب: ${esc(e.message)}</p>`}
}
async function scorers(c){
  nav('h');
  const chips=TB.map(k=>`<a class="${c===k?'on':''}" href="#/scorers/${k}">${LG[k]}</a>`).join('');
  app.innerHTML=subnav('s')+`<div class="chips">${chips}</div><p class="msg">جاري التحميل…</p>`;
  const set=h=>app.querySelector('.msg').outerHTML=h;
  try{const r=await fetch('/api/scorers?comp='+c),j=await r.json();if(!r.ok)throw new Error(j.error||r.status);
    set(j.rows.length?`<table><tr><th>#</th><th style="text-align:right">اللاعب</th><th>الفريق</th><th>أهداف</th></tr>${j.rows.map((x,i)=>`<tr><td>${i+1}</td><td class="n"><div>${crest({c:x.c,t:x.t,n:x.n})}${esc(x.p)}</div></td><td>${esc(nm(x.n))}</td><td><b>${x.g}</b></td></tr>`).join('')}</table>`:'<p class="msg">لا توجد بيانات هدافين حالياً.</p>')}
  catch(e){set(`<p class="msg err">تعذر جلب الهدافين: ${esc(e.message)}</p>`)}
}
function route(){
  const [,p,a]=location.hash.split('/');window.scrollTo(0,0);
  if(p==='live')live();else if(p==='watch')watch(a);else if(p==='table')table(a||'PL');else if(p==='scorers')scorers(a||'PL');else home();
}
addEventListener('hashchange',route);route();
setInterval(tick,1000);
setInterval(()=>{if(!document.hidden&&['','live'].includes(location.hash.split('/')[1]||''))route()},120000);
</script>
</body>
</html>
