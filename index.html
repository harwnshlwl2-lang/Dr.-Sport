<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>سرمد سبورت</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#000;--s1:#0c110f;--s2:#141b18;--line:#1f2a25;--tx:#eef5f1;--mu:#8a9a92;--g1:#06f26a;--g2:#17dcd0;--grad:linear-gradient(135deg,var(--g1),var(--g2));--live:#ff4d4d;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,.lg-title{font-family:'Lalezar',"IBM Plex Sans Arabic",sans-serif;font-weight:400}

/* الشريط العلوي */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header img{width:36px;height:36px;object-fit:contain}
header h1{font-size:1.5rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
.tools{display:flex;align-items:center;gap:8px}
.soc{display:flex;gap:6px}
.soc a{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--s1);border-radius:50%;color:var(--g2);transition:.2s}
.soc a:hover{background:var(--grad);color:#000;border-color:transparent}
.soc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{max-width:760px;margin:0 auto}

/* الصورة الكبرى مع الفلتر السينمائي الاحترافي */
.hero-wrap{position:relative;margin:0 14px 18px}
.hero{position:relative;min-height:240px;border-radius:0 0 22px 22px;background:#0c110f center/cover;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.2) 100%), radial-gradient(circle at 50% 30%, rgba(6,242,106,0.18) 0%, transparent 70%);z-index:1}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:var(--grad);box-shadow:0 0 20px 4px rgba(6,242,106,.6);z-index:2}
.hin{position:relative;z-index:3;padding:20px;width:100%;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hin h2{font-size:1.8rem;flex-basis:100%;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.cd{font-weight:600;font-variant-numeric:tabular-nums;color:var(--g1);font-size:.95rem;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.1)}
.play{background:var(--grad);color:#00170a;font-weight:700;padding:10px 24px;border-radius:30px;box-shadow:0 4px 15px rgba(6,242,106,.3)}

/* التبويبات والشرائح */
.sub{display:grid;grid-template-columns:repeat(4,1fr);margin:0 14px 12px;border-bottom:1px solid var(--line)}
.sub a{padding:11px 0;text-align:center;color:var(--mu);font-weight:600;font-size:.9rem;position:relative}
.sub a.on{color:var(--tx)}
.sub a.on::after{content:"";position:absolute;inset-inline:25%;bottom:-1px;height:3px;background:var(--grad);border-radius:3px;box-shadow:0 0 10px var(--g1)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 16px;border-radius:30px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-size:.88rem;font-weight:500;white-space:nowrap}
.chip.on{background:var(--grad);color:#00170a;border-color:transparent;font-weight:700}
.day-btn{flex:none;min-width:60px;padding:8px 6px;border-radius:14px;text-align:center;color:var(--mu);background:var(--s1);border:1px solid var(--line);font-size:.8rem}
.day-btn b{display:block;font-family:'Lalezar';font-size:1.2rem;color:var(--tx);font-weight:400}
.day-btn.on{background:var(--grad);color:#00170a;border-color:transparent}
.day-btn.on b{color:#00170a}

/* المباريات */
.grp{margin:0 14px 14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(270deg,rgba(6,242,106,.08),transparent);border-bottom:1px solid var(--line);font-family:'Lalezar';font-size:1.1rem;color:var(--g2)}
.ghead img{width:22px;height:22px;object-fit:contain}
.row{display:grid;grid-template-columns:60px 1fr 76px 1fr;align-items:center;gap:4px;padding:12px 10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--s2)}
.st{display:flex;flex-direction:column;align-items:center;font-size:.75rem;color:var(--mu);text-align:center}
.st .kt{font-weight:700;color:var(--tx);font-size:.85rem}
.live{color:var(--live);font-weight:700;display:flex;align-items:center;gap:4px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--live);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.t{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.t span{font-size:.8rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t img,.ph{width:30px;height:30px;object-fit:contain}
.ph{display:grid;place-items:center;border-radius:50%;background:var(--s2);color:var(--g2);font-size:.6rem;font-style:normal;font-weight:700}
.mid{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 6px;border-radius:10px;background:#000;border:1px solid var(--line);font-family:'Lalezar';font-size:1.2rem}
.mid i{font-style:normal;color:var(--mu);font-size:1rem}
.mid .vs{font-size:.9rem;color:var(--mu)}
.mid.lv{border-color:rgba(6,242,106,.5);box-shadow:0 0 10px rgba(6,242,106,.2)}

/* الجداول والهدافين والدوريات */
.card{margin:0 14px 14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th{color:var(--mu);font-weight:500;font-size:.75rem;padding:10px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center}
tr:last-child td{border-bottom:0}
td.n{text-align:right;min-width:130px}
td.n div{display:flex;align-items:center;gap:8px;font-weight:600}
td b{color:var(--g1)}
.lgs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.lg-card{padding:16px 12px;text-align:center;border-radius:16px;background:var(--s1);border:1px solid var(--line)}
.lg-card img{width:48px;height:48px;object-fit:contain;margin-bottom:8px}
.lg-card h3{font-size:.95rem;margin-bottom:10px}
.lg-card div{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.lg-card a{padding:4px 12px;border-radius:20px;font-size:.78rem;border:1px solid var(--line);color:var(--mu)}

/* صفحة المشاهدة والتفاصيل */
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.back{color:var(--mu);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.match-header{margin:0 14px 14px;padding:18px;border-radius:18px;background:radial-gradient(circle at 50% 0%,rgba(6,242,106,.12),transparent 70%),var(--s1);border:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.match-header .t-team img{width:54px;height:54px}
.match-header .score-box{font-family:'Lalezar';font-size:2.4rem;line-height:1}
.pl{aspect-ratio:16/9;width:100%;border:0;border-radius:16px;background:#000;display:block;margin:0 14px 12px;box-shadow:0 10px 30px rgba(6,242,106,.3)}
.note{margin:0 14px 12px;padding:12px;border-radius:12px;background:rgba(23,220,208,.08);border:1px solid rgba(23,220,208,.2);font-size:.85rem;color:#cfe}
.promo{display:flex;align-items:center;gap:10px;margin:0 14px 12px;padding:12px;border-radius:14px;border:1px solid var(--line);font-size:.88rem;background:var(--s1)}
.promo a{background:var(--grad);color:#00170a;font-weight:700;padding:6px 14px;border-radius:20px;white-space:nowrap}

.msg{padding:40px 0;text-align:center;color:var(--mu)}
.err{color:var(--live)}
.ad{width:100%;border:0;min-height:90px;margin:14px 0}

/* الشريط السفلي */
nav.bt{position:fixed;inset:auto 0 0;z-index:60;display:grid;grid-template-columns:1fr 1fr;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgba(0,0,0,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.bt a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);font-size:.78rem;font-weight:600}
nav.bt a i{font-size:1.1rem}
nav.bt a.on{color:var(--g1)}
nav.bt a.on::before{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 4px 4px;background:var(--grad);box-shadow:0 0 10px var(--g1)}

@media(min-width:760px){body,nav.bt{max-width:760px;margin:0 auto}}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="" onerror="this.style.display='none'">
  <h1 id="sn">سرمد سبورت</h1>
  <div class="tools">
    <div class="soc" id="soc"></div>
  </div>
</header>

<main id="app"></main>

<nav class="bt">
  <a href="#/" id="n-home"><i class="fa-solid fa-house"></i>الرئيسية</a>
  <a href="#/live" id="n-live"><i class="fa-solid fa-tower-broadcast"></i>البث المباشر</a>
</nav>

<script src="config.js"></script>
<script>
const C=window.CONFIG||{}, $=s=>document.querySelector(s), app=$('#app');
const admin=/admin=1/.test(location.search);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=u=>new Date(u).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const iso=d=>d.toISOString().slice(0,10);

// أسماء الدوريات وترتيبها (جعل آسيا في النهاية تماماً كما طلبت)
const LG={PL:'الدوري الإنجليزي الممتاز',PD:'الدوري الإسباني',SA:'الدوري الإيطالي',BL1:'الدوري الألماني',FL1:'الدوري الفرنسي',CL:'دوري أبطال أوروبا',ACL:'دوري أبطال آسيا'};
const ORDER=['PL','PD','SA','BL1','FL1','CL','ACL'];
const cache={}; let date=iso(new Date()), lg='all';
let favs=new Set(JSON.parse(localStorage.getItem('sp_favs')||'[]'));

$('#sn').textContent=C.siteName||'سرمد سبورت';

// أيقونات التواصل الاجتماعي
const SOC_ICONS={telegram:'<path d="M21 3 3 10.5l6 2 2 6 3-4 5 4z"/><path d="m9 12.5 9-6"/>',whatsapp:'<path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3z"/><path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 .7c-.8-.4-1.6-1.2-2-2l.7-1-1-2z"/>',instagram:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6"/>',facebook:'<path d="M14 8h2.5V4.5H14C11.8 4.5 10.5 6 10.5 8v2H8v3.5h2.5V20H14v-6.5h2.5l.5-3.5h-3V8.5c0-.3.2-.5.5-.5z"/>'};
if(C.social){
  $('#soc').innerHTML=Object.keys(SOC_ICONS).filter(k=>C.social[k]).map(k=>`<a href="${esc(C.social[k])}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24">${SOC_ICONS[k]}</svg></a>`).join('');
}

const ad=n=>C.ads&&C.ads[n]?`<iframe class="ad" sandbox="allow-scripts allow-popups" srcdoc="${esc(C.ads[n])}"></iframe>`:'';
const crest=t=>t.c?`<img src="${esc(t.c)}" alt="" loading="lazy">`:`<i class="ph">${esc((t.t||t.n||'?').slice(0,3))}</i>`;
const isLive=m=>m.status==='IN_PLAY'||m.status==='PAUSED';

async function loadMatches(d){
  if(cache[d]&&Date.now()-cache[d].t<60000)return cache[d].m;
  const r=await fetch('/api/matches?date='+d), j=await r.json();
  if(!r.ok)throw new Error(j.error||r.status);
  cache[d]={m:j.matches,t:Date.now()}; return j.matches;
}

function rowHTML(m){
  const live=isLive(m), done=m.status==='FINISHED', sc=(live||done)&&m.hs!=null;
  const lab=live?(m.status==='PAUSED'?'استراحة':'مباشر'+(m.minute?' '+m.minute+"'":'')):done?'انتهت':m.status==='POSTPONED'?'مؤجلة':'قريبا';
  const isFav=favs.has(m.home?.n)||favs.has(m.away?.n);
  return `<a class="row" href="#/watch/${m.id}">
    <span class="st"><span class="${live?'live':''}">${live?'<i></i>':''}${lab}</span><span class="kt">${sc?'-':tm(m.utc)}</span></span>
    <span class="t">${crest(m.home)}<span>${esc(m.home.n)}</span></span>
    <span class="mid${live?' lv':''}"><b>${sc?m.hs:''}</b><span class="vs">${sc?'-':'VS'}</span><b>${sc?m.as:''}</b></span>
    <span class="t">${crest(m.away)}<span>${esc(m.away.n)}</span></span>
  </a>`;
}

function groupsHTML(ms){
  if(!ms.length)return '<div class="msg">لا توجد مباريات في هذا اليوم.</div>';
  const g={}; ms.forEach(m=>(g[m.comp]=g[m.comp]||[]).push(m));
  return ORDER.filter(k=>g[k]).map((k,i)=>`
    <div class="grp">
      <div class="ghead"><i class="fa-solid fa-trophy"></i><span>${LG[k]||k}</span><small style="margin-inline-start:auto">${g[k].length}</small></div>
      ${g[k].map(rowHTML).join('')}
    </div>${i===0?ad('middle'):''}`).join('');
}

function subnav(on){
  return `<nav class="sub">
    <a class="${on==='m'?'on':''}" href="#/">المباريات</a>
    <a class="${on==='t'?'on':''}" href="#/table/PL">الترتيب</a>
    <a class="${on==='s'?'on':''}" href="#/scorers/PL">الهدافون</a>
    <a class="${on==='l'?'on':''}" href="#/leagues">الدوريات</a>
  </nav>`;
}

function heroHTML(){
  const h=C.hero; if(!h||!h.image)return '';
  return `<div class="hero-wrap"><section class="hero" style="background-image:url('${encodeURI(h.image)}')">
    <div class="hin">
      <h2>${esc(h.title||C.siteName)}</h2>
      <span id="cd" data-k="${esc(h.kickoff||'')}"></span>
      ${h.matchId?`<a class="play" href="#/watch/${esc(h.matchId)}"><i class="fa-solid fa-play"></i> شاهد الآن</a>`:''}
    </div>
  </section></div>`;
}

function tickCd(){
  const e=$('#cd'); if(!e||!e.dataset.k)return;
  const s=Math.floor((new Date(e.dataset.k)-Date.now())/1000);
  if(s<=0){e.textContent='بدأت المباراة';return}
  const p=n=>String(n).padStart(2,'0'), d=Math.floor(s/86400);
  e.textContent=(d?d+' يوم ':'')+p(Math.floor(s%86400/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60);
}

function updateNav(k){
  $('#n-home').className=k==='h'?'on':'';
  $('#n-live').className=k==='l'?'on':'';
}

// الصفحة الرئيسية (مع شريط الأيام المتقدم والفلتر)
async function viewHome(){
  updateNav('h');
  const chips=['all',...ORDER].map(k=>`<a class="${lg===k?'on':''}" data-lg="${k}">${k==='all'?'الكل':(LG[k]||k)}</a>`).join('');
  
  // شريط الأيام (من أمس إلى 5 أيام قادمة)
  let daysHTML='';
  for(let i=-1; i<=5; i++){
    const d=new Date(); d.setDate(d.getDate()+i); const v=iso(d);
    const lbl=i===0?'اليوم':i===-1?'أمس':i===1?'غداً':d.toLocaleDateString('ar',{weekday:'short'});
    daysHTML+=`<button class="day-btn ${v===date?'on':''}" data-d="${v}">${lbl}<b>${d.getDate()}</b></button>`;
  }

  app.innerHTML=heroHTML()+ad('top')+subnav('m')+
    `<div class="scroller" id="dc">${daysHTML}</div>`+
    `<div class="scroller" id="lc">${chips}</div>`+
    `<div id="ml"><div class="msg">جاري تحميل المباريات...</div></div>`+ad('bottom');
  
  tickCd();
  $('#dc').onclick=e=>{const b=e.target.closest('[data-d]'); if(b){date=b.dataset.d; viewHome();}};
  $('#lc').onclick=e=>{const b=e.target.closest('[data-lg]'); if(b){lg=b.dataset.lg; viewHome();}};

  try{
    let ms=await loadMatches(date);
    if(lg!=='all')ms=ms.filter(m=>m.comp===lg);
    $('#ml').innerHTML=groupsHTML(ms);
  }catch(e){
    $('#ml').innerHTML=`<div class="msg err">تعذر جلب المباريات: ${esc(e.message)}<br><button onclick="viewHome()" style="margin-top:10px;padding:6px 16px;background:var(--grad);color:#000;border-radius:20px;font-weight:700">إعادة المحاولة</button></div>`;
  }
}

// البث المباشر
async function viewLive(){
  updateNav('l');
  app.innerHTML=subnav('m')+`<div style="padding:14px"><h3 class="lg-title" style="color:var(--g2);font-size:1.2rem;margin-bottom:10px">المباريات الجارية الآن</h3></div><div id="lm"><div class="msg">جاري التحقق من المباريات المباشرة...</div></div>`;
  try{
    const ms=(await loadMatches(iso(new Date()))).filter(isLive);
    $('#lm').innerHTML=ms.length?groupsHTML(ms):'<div class="msg">لا توجد مباريات جارية حالياً. تفقد جدول اليوم.</div>';
  }catch(e){$('#lm').innerHTML=`<div class="msg err">خطأ في التحميل: ${esc(e.message)}</div>`;}
}

// صفحة جدول الترتيب
async function viewTable(comp){
  updateNav('h');
  const chips=ORDER.filter(k=>k!=='ACL').map(k=>`<a class="${comp===k?'on':''}" href="#/table/${k}">${LG[k]}</a>`).join('');
  app.innerHTML=subnav('t')+`<div class="scroller">${chips}</div><div id="tb"><div class="msg">جاري تحميل جدول الترتيب...</div></div>`;
  try{
    const r=await fetch('/api/standings?comp='+comp), j=await r.json();
    if(!r.ok)throw new Error(j.error);
    const html=j.groups.map(g=>`
      <div class="card"><div class="tw"><table>
        <thead><tr><th>#</th><th style="text-align:right">الفريق</th><th>لعب</th><th>+/-</th><th>نقاط</th></tr></thead>
        <tbody>${g.rows.map(x=>`<tr><td>${x.p}</td><td class="n"><div>${crest({c:x.c,n:x.n})}${esc(x.n)}</div></td><td>${x.pl}</td><td>${x.gd}</td><td><b>${x.pts}</b></td></tr>`).join('')}</tbody>
      </table></div></div>`).join('');
    $('#tb').innerHTML=html||'<div class="msg">الترتيب غير متوفر حالياً.</div>';
  }catch(e){$('#tb').innerHTML=`<div class="msg err">تعذر جلب الترتيب: ${esc(e.message)}</div>`;}
}

// صفحة الهدافين
async function viewScorers(comp){
  updateNav('h');
  const chips=ORDER.filter(k=>k!=='ACL').map(k=>`<a class="${comp===k?'on':''}" href="#/scorers/${k}">${LG[k]}</a>`).join('');
  app.innerHTML=subnav('s')+`<div class="scroller">${chips}</div><div id="sc"><div class="msg">جاري تحميل الهدافين...</div></div>`;
  try{
    const r=await fetch('/api/scorers?comp='+comp), j=await r.json();
    if(!r.ok)throw new Error(j.error);
    const rows=j.scorers||[];
    $('#sc').innerHTML=rows.length?`<div class="card"><div class="tw"><table>
      <thead><tr><th>#</th><th style="text-align:right">اللاعب</th><th>النادي</th><th>الأهداف</th></tr></thead>
      <tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td class="n"><div>${esc(x.player.name)}</div></td><td>${esc(x.team.name)}</td><td><b>${x.goals}</b></td></tr>`).join('')}</tbody>
    </table></div></div>`:'<div class="msg">قائمة الهدافين غير متوفرة.</div>';
  }catch(e){$('#sc').innerHTML=`<div class="msg err">تعذر جلب الهدافين: ${esc(e.message)}</div>`;}
}
